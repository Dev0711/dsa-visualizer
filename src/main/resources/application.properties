# Dynamic port for Render deployment — Render injects $PORT at runtime.
# Falls back to 8080 for local development.
server.port=${PORT:8080}

spring.application.name=dsa-visualizer

# Slightly more verbose logging while developing
logging.level.com.dsaviz=DEBUG

# CORS: comma-separated list of allowed origins.
# In production (Render), set the CORS_ALLOWED_ORIGINS env var to your
# Vercel frontend URL, e.g. https://your-dsa-visualizer.vercel.app
# Leave unset (or *) for local development.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

